name: ci
on:
  push:
    branches: [main, feature/theory-book-player]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PianoMan.sln
      - name: Build
        run: dotnet build PianoMan.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PianoMan.sln --configuration Release --no-build --verbosity normal
      - name: Smoke CLI
        run: dotnet run --project src/PianoMan.Cli --configuration Release --no-build -- demo > artifacts-cli.json
      - name: JavaScript syntax
        run: node --check src/PianoMan.Web/wwwroot/app.js
      - name: Smoke web
        shell: bash
        run: |
          dotnet run --project src/PianoMan.Web --configuration Release --no-build -- --urls http://127.0.0.1:5080 > /tmp/pianoman-web.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:5080/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:5080/api/demo | grep -q '1. e4 e5 2. Nf3 Nc6'
          curl -fsS -H 'content-type: application/json' -d '{"pgn":"1. e4 e5 2. Nf3 Nc6 *"}' http://127.0.0.1:5080/api/analyze | grep -q 'timeline'
          curl -fsS -H 'content-type: application/json' -d '{"fen":"rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1","uci":"e7e5","ply":2}' http://127.0.0.1:5080/api/move | grep -q 'legalMoves'
          curl -fsS -H 'content-type: application/json' -d '{"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","maxPlies":4}' http://127.0.0.1:5080/api/principal-line | grep -q 'selectiveExtensions'
      - name: Publish Native AOT CLI
        run: dotnet publish src/PianoMan.Cli/PianoMan.Cli.csproj --configuration Release --runtime linux-x64 --output artifacts/linux-x64
      - name: Smoke native CLI
        run: ./artifacts/linux-x64/pianoman demo > /dev/null
